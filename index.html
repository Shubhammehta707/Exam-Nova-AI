<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Nova AI — Class 12 CBSE Board Quiz</title>
    <meta name="description" content="NCERT-aligned practice quizzes, conceptual problem solving, and CBSE Class 12 board exam preparation for Physics, Chemistry, and Mathematics." />
    <meta property="og:title" content="Exam Nova AI — Class 12 CBSE Board Quiz" />
    <meta property="og:description" content="NCERT-aligned practice quizzes, conceptual problem solving, and CBSE Class 12 board exam preparation for Physics, Chemistry, and Mathematics." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('examnova_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('examnova_language');
          if (savedLang) {
            document.documentElement.setAttribute('lang', savedLang);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
