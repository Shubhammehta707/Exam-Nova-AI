[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Direct redirect to Netlify function for quiz generation
[[redirects]]
  from = "/api/generate-quiz"
  to = "/.netlify/functions/generate-quiz"
  status = 200

# Direct redirect to Netlify function for health checks
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Catch-all API redirect to any Netlify function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-Page Application (SPA) fallback to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
